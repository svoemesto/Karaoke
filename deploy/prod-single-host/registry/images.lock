| 2026-10-11 | `mirror/minio/minio:RELEASE.2025-09-07T16-13-09Z` | — | `sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2` | **Происхождение и действующий пин различаются — это не ошибка.** Перенос сделан из локальной копии: `quay.io/minio/minio` отдаёт 401 на любой тег, в Docker Hub репозитория нет. У quay образ был **индексом** multi-arch (`sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e` — он же остался в `RepoDigests` прода), а наш registry хранит **платформенный манифест** (`mediaType: application/vnd.docker.distribution.manifest.v2+json`, `config.digest` = `sha256:69b2ec20…`, 9 слоёв) с дайджестом `sha256:a1a8bd4a…`. Контент идентичен — доказано совпадением `.Id` = `sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e` и `Created` = `2025-09-07T18:42:37.017942402Z` у образа на проде и у копии на admin. Пиновать **обязано** дайджестом нашего registry: по `sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e` `docker pull` получил бы 404, потому что такого манифеста у нас нет. `image:` прода переключается на этот пин в задачах T018–T022 (owner-гейт). |
