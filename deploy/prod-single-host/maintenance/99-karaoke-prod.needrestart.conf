# Needrestart на прод-хосте: НИКОГДА не перезапускать службы автоматически.
#
# Инцидент 2026-11-18: ночное автообновление установило пакет needrestart, и он
# при первом же запуске через apt-хук (/etc/apt/apt.conf.d/99needrestart)
# перезапустил все службы с устаревшими библиотеками — включая containerd.
# containerd поднялся через 61 секунду, но задачи контейнеров были потеряны:
# docker остался с устаревшим статусом «running», процесса не было. Прод-БД не
# принимала соединения 2,5 часа, karaoke-web висел unhealthy, karaoke-registry
# умер (порт держал осиротевший docker-proxy).
#
# Решение (задача KARAOKE-431):
#   * restart = 'l' — только ПОКАЗАТЬ список служб, требующих перезапуска,
#     никаких действий. Перезапуск — осознанное действие владельца.
#   * override_rc — вторая линия защиты: даже если режим поменяют, эти службы
#     не будут перезапущены автоматически. Перезапуск containerd/docker на
#     работающем прод-хосте = потеря задач всех контейнеров.
#
# Применение: /etc/needrestart/conf.d/99-karaoke-prod.conf (права 644).

$nrconf{restart} = 'l';

$nrconf{override_rc} = {
    # Контейнерная среда: перезапуск рвёт процессы всех контейнеров.
    qr{^containerd\.service$}        => 0,
    qr{^docker\.service$}            => 0,
    # Публичный вход и веб: перезапуск = кратковременный отказ сайта.
    qr{^nginx\.service$}             => 0,
    qr{^ssh\.service$}               => 0,
    # Базовые службы ОС: останавливаются последними, их рестарт ломает сессию
    # журнала и порядок загрузки.
    qr{^systemd-journald\.service$}  => 0,
    qr{^systemd-udevd\.service$}     => 0,
};
