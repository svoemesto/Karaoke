version: "3.9"
services:
  karaoke-storage:
    # minio/minio удалён с Docker Hub (2026-04-25, 404) → Quay.
    # Версия запинена ровно та, что работала на старом storage (RELEASE.2025-09-07,
    # формат xl-single совместим). Решение wayfinder #177.
    # Pass 540 (FR-007/FR-008): образ взят из НАШЕГО registry и пинован.
    # Пин — платформенный манифест нашего registry; он отличается от quay-дайджеста
    # (индекс multi-arch) при том же содержимом. См. registry/images.lock § История.
    # Переключение вступает в силу при следующем пересоздании контейнера.
    image: sm-karaoke.ru:5443/mirror/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    environment:
      - MINIO_ACCESS_KEY=${STORAGE_KEY}
      - MINIO_SECRET_KEY=${STORAGE_SECRET}
      - WORK_IN_CONTAINER=1
    container_name: karaoke-storage
    ports:
      # Наружу не открываем (#172): API доступен host-nginx и admin-машине.
      # 8890 (API) — loopback; admin (185.26.28.109, 83.137.50.231, 185.26.28.199) ходит сюда для remote storage.
      - "127.0.0.1:${STORAGE_PORT_HOST}:${STORAGE_PORT_INSIDE_CONTAINER}" # порт хоста : порт внутри контейнера
      - "127.0.0.1:${STORAGE_CONSOLE_PORT_HOST}:${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER}" # console
    command: server /data --console-address ":${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER}"
    networks:
      - karaokenet
    volumes: # локальная папка : папка внутри контейнера
      - ${STORAGE_FOLDER}:/data # /sm-karaoke/system/Караоке-storage → /data
    restart: always
    # BR-546 (аудит #336 / P-73-08, OpenProject #371): ротация логов.
    # Без max-size/max-file json-file драйвер растёт, пока не забьёт диск
    # прод-хоста (985 ГБ): Postgres перестаёт писать ("No space left on device"),
    # сайт не отвечает — инцидент 2026-07-09. Раньше ротация была только
    # у registry (deploy/prod-single-host/docker-compose-registry.yml).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  karaokenet:
    external: true
    name: deploy_karaokenet
