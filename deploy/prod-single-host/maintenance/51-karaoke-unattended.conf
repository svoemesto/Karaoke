# Автообновления APT на прод-хосте: без автоперезагрузки (задача KARAOKE-431).
#
# Явно фиксируем то, что раньше работало «по умолчанию» (в 50unattended-upgrades
# строка была закомментирована): хост НЕ перезагружается сам после обновлений.
# Автоматические обновления при этом не отключаются — они нужны для безопасности,
# но их последствия не должны ронять прод без участия человека.
#
# Применение: /etc/apt/apt.conf.d/51-karaoke-unattended.conf (права 644).

Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

# Журнал обновлений — чтобы после окна было видно, что именно обновилось.
Unattended-Upgrade::SyslogEnable "true";
