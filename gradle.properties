# Gradle / Kotlin daemon JVM args.
# Проект большой (karaoke-app содержит MLT-генератор + LLM-поиск текстов,
# парсеры; auto-kdoc генерирует документацию в compile-time). Дефолтного
# 1g не хватает — падает с OutOfMemoryError на :karaoke-app:compileKotlin
# (GC overhead limit exceeded в org.objectweb.asm.MethodWriter).
# 4g — практический минимум; если падает — увеличить до 6g.

# Gradle daemon: компиляция, инкрементальные сборки, configuration cache.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/gradle-heap.hprof

# Kotlin daemon: тяжёлый bytecode generation через ASM для karaoke-app.
# Увеличение heap критично для :karaoke-app:compileKotlin (VkVideoSaveResult,
# Song/Storage/MLT и др. тяжёлые data class-ы).
kotlin.daemon.jvmargs=-Xmx4g

# Параллельная сборка модулей ускоряет CI, но удваивает потребление памяти.
# При 4g на daemon лучше оставить только когда памяти хватает.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
