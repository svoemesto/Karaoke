# Ночное окно автообновлений вместо утреннего (задача KARAOKE-431).
#
# Было: apt-daily-upgrade.timer срабатывал около 07:00 МСК — в начале рабочего
# дня. Инцидент 2026-11-18 пришёлся ровно на это окно (06:59 старт → 07:11
# перезапуск containerd → прод-БД легла на 2,5 часа).
#
# Стало: 03:30 ± 30 минут. Ночью нет пользователей, а если что-то пойдёт не так,
# утро начинается с рабочего прода, а не с разбора последствий.
#
# Установка: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
#   systemctl daemon-reload && systemctl restart apt-daily-upgrade.timer
# Проверка:   systemctl list-timers apt-daily-upgrade.timer

[Timer]
# Пустое значение сбрасывает штатное расписание пакета, иначе systemd сложит
# оба: старый OnCalendar остался бы и обновления шли бы в 07:00.
OnCalendar=
OnCalendar=*-*-* 03:30:00
RandomizedDelaySec=30min
