version: '3.8'

services:
  whisper-downloader:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper-downloader
    restart: "no"
    init: true
    # WHISPER_MODEL должен совпадать со значением в whisper-asr/whisper-asr-cpu ниже -
    # download_model.py читает именно эту переменную (см. deploy/download_model.py), иначе
    # скачает не ту модель (дефолт скрипта - medium), которую реально будут грузить сервисы.
    # HF_TOKEN - для гейтед-репозиториев на HuggingFace (некоторые модели требуют авторизации
    # и принятой лицензии, в отличие от полностью публичного medium).
    environment:
      - WHISPER_MODEL=large-v3-turbo
      - HF_TOKEN=hf_key
    # Docker-мост не всегда получает рабочий DNS от хоста (VPN/локальный резолвер могут
    # возвращать адреса, недоступные из контейнера, см. docker-compose-ollama.yml - тот же
    # приём уже используется для другого GPU-контейнера, которому тоже нужен внешний интернет).
    dns:
      - 1.1.1.1 # Cloudflare DNS
      - 8.8.4.4 # Google DNS (альтернативный)
      - 77.88.8.8 # Яндекс DNS (если вы в РФ)
    volumes:
      - ./whisper_models:/var/lib/whisper
      - ./download_model.py:/download_model.py:ro
    # Используем наш Python-скрипт - работает через стандартную библиотеку
    entrypoint: ["python", "/download_model.py"]
    # Без GPU - загрузчику видеокарта не нужна
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 0
              capabilities: [gpu]

  # GPU-версия Whisper (основная, быстрая)
  whisper-asr:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper-asr
    restart: always
    init: true
    depends_on:
      whisper-downloader:
        condition: service_completed_successfully
    ports:
      - "8015:9000"
    environment:
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_ENGINE=faster-whisper
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_API_KEY=nafanya_whisper_2026
      - HF_TOKEN=hf_key
    dns:
      - 1.1.1.1 # Cloudflare DNS
      - 8.8.4.4 # Google DNS (альтернативный)
      - 77.88.8.8 # Яндекс DNS (если вы в РФ)
    volumes:
      - ./whisper_models:/var/lib/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/v1/models')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU-версия Whisper (fallback, если GPU не справился с VRAM)
  whisper-asr-cpu:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper-asr-cpu
    restart: always
    init: true
    depends_on:
      whisper-downloader:
        condition: service_completed_successfully
    ports:
      - "8016:9000"
    environment:
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_ENGINE=faster-whisper
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_API_KEY=nafanya_whisper_2026
      - HF_TOKEN=hf_key
    dns:
      - 1.1.1.1 # Cloudflare DNS
      - 8.8.4.4 # Google DNS (альтернативный)
      - 77.88.8.8 # Яндекс DNS (если вы в РФ)
    volumes:
      - ./whisper_models:/var/lib/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/v1/models')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # CPU не требует GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 0
              capabilities: [gpu]
