# images.lock — карта пинов сторонних контейнерных образов (FR-008, FR-018)
#
# Единственный источник правды о том, какие сторонние образы живут в нашем registry
# и на каком дайджесте они зафиксированы. Заполняется `tools/registry-vendor.sh`,
# проверяется им же в режиме `--verify`.
#
# Формат — markdown-таблица; парсер (awk по '|') не должен ломаться:
#   | upstream_ref | our_ref | digest | checked_at |
#
# Правила (contracts/image-naming.md § 3.2):
#   * `our_ref` всегда в namespace `mirror/**` — исходный путь upstream сохраняется,
#     хост upstream (`docker.io/`, `ghcr.io/`, `quay.io/`) отбрасывается;
#   * в `library/**` не пушим никогда (это read-only зона pull-through, инвариант I-2);
#   * плавающий тег допустим только вместе с `@sha256:`; `digest` — обязателен для
#     всех строк, у которых `our_ref` используется прод-хостом (FR-007);
#   * изменение пина — новой строкой в «Истории», прежний дайджест не переписывается молча.
#
# Порядок строк: сначала пять небиблиотечных образов решения #279, затем базовые
# образы прода (`minio` — FR-007, `postgres` — решение #276) и база сборки Demucs
# (`nvidia/cuda` — FR-017). Собственный `demucs` здесь не указан: он собирается нами
# (`do_build_demucs`, § 3.1 контракта), а не переносится от upstream.

