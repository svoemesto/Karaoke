# nginx-конфигурация для e2e-тестов публичного сайта в CI.
#
# Зачем отдельный конфиг (BR-525, аудит #336, OpenProject #387). Боевой
# конфиг karaoke-public/nginx_karaoke-public.conf проксирует /api/* на
# контейнер karaoke-web по DNS-имени. В CI такого контейнера нет, и nginx
# не стартует вовсе («host not found in upstream»). Здесь — только статика
# собранного SPA и заглушка API: e2e проверяет, что публичный сайт
# отдаётся и грузится, а не данные бэкенда.
#
# Образ — тот же, что на проде (deploy/karaoke-public/Dockerfile: сборка в
# node:22-alpine, раздача в nginx:stable — правила R-04 и R-05).
#
# Монтируется в контейнер:
#   docker run -d -p 7907:7907 \
#     -v "$PWD/karaoke-public/e2e/nginx-e2e.conf:/etc/nginx/nginx.conf:ro" \
#     karaoke-public:e2e

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /var/log/nginx/access.log;
  sendfile      on;
  keepalive_timeout  65;

  server {
    listen       7907;
    server_name  localhost;
    root         /app;
    index        index.html;

    # SPA-fallback: vue-router живёт в history-mode, любой путь отдаёт
    # index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Заглушка API: приложение должно загрузиться без ошибок в консоли, а
    # данных e2e не проверяет. Пустой JSON вместо index.html — иначе SPA
    # получил бы HTML вместо JSON и упал бы с ошибкой разбора.
    location /api/ {
      default_type application/json;
      return 200 '{}';
    }

    # Картинки из MinIO в CI недоступны. Отдаём 404, а не index.html:
    # иначе браузер пытается распарсить HTML как изображение.
    location /minio/ {
      return 404;
    }
  }
}
