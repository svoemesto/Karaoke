# Проверка живости контейнеров сразу после автообновления (задача KARAOKE-431).
#
# Зачем: обновление пакетов может перезапустить службы (needrestart) или уронить
# containerd. Тогда docker оставляет контейнеры в статусе «running», хотя их
# процессов нет — политика restart: always в этом случае не срабатывает
# (инцидент 2026-11-18: прод-БД лежала 2,5 часа).
#
# Поэтому сразу после окна обновлений запускается сторож: он находит такие
# «зомби» по cgroup и поднимает контейнеры штатным путём (do.sh).
#
# Установка: /etc/systemd/system/apt-daily-upgrade.service.d/override.conf
#   systemctl daemon-reload
# Проверка:   systemctl cat apt-daily-upgrade.service | tail -5
#
# «-» перед командой: сбой проверки не должен делать вид, что обновление
# провалилось — обновление уже прошло, а состояние контейнеров важнее кода
# возврата юнита.

[Service]
ExecStartPost=-/usr/local/sbin/karaoke-container-watchdog.sh --apply
