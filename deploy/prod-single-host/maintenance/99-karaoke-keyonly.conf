# Вход по SSH только по ключу (KARAOKE-435, runbook ssh-access § 6).
#
# ПРИМЕНЕНО на прод-хосте 2026-11-19 13:10 МСК.
#
# Основание: 9 747 попыток входа за сутки, четыре источника по ~2 000,
# перебирали root, deployer, cloud, park, adminuser — при разрешённом входе
# root по паролю (PasswordAuthentication yes, PermitRootLogin yes).
#
# Правило владельца: пароль по SSH не принимается. Вход — только по ключу:
#   * nsa@nsa-i9 (RSA)                        — ручная работа: ssh, scp, rsync;
#   * karaoke-tunnel-cert-renew@nsa-i9 (ed25519) — таймер продления сертификата.
#
# ВАЖНО про имя файла. В /etc/ssh/sshd_config есть `Include
# /etc/ssh/sshd_config.d/*.conf`, файлы читаются по алфавиту и последнее
# значение побеждает. На хосте лежит 50-cloud-init.conf с
# `PasswordAuthentication yes` — файл с именем 10-... был бы им перекрыт, и
# настройка выглядела бы применённой, не будучи применённой. Поэтому имя
# начинается с 99. Дополнительно 50-cloud-init.conf приведён к `no`, чтобы при
# снятии этого drop-in пароль не вернулся молча.
#
# ПРОВЕРКА (обязательна после применения, в НОВОЙ сессии):
#   sshd -T | grep -E "^(passwordauthentication|permitrootlogin)"
#       → passwordauthentication no / permitrootlogin prohibit-password
#   ssh -o BatchMode=yes -o PreferredAuthentications=password \
#       -o PubkeyAuthentication=no root@188.127.240.124
#       → Permission denied (publickey)
#
# ОТКАТ. Пароль возвращается только осознанно:
#   rm /etc/ssh/sshd_config.d/99-karaoke-keyonly.conf
#   printf 'PasswordAuthentication yes\n' > /etc/ssh/sshd_config.d/50-cloud-init.conf
#   sshd -t && systemctl reload ssh
# Перед откатом — прочитать runbook ssh-access § 5: пароль по SSH — это снова
# открытый перебор; если доступ потерян, идти через консоль провайдера, а не
# включать пароль.

PasswordAuthentication no
PermitRootLogin prohibit-password
