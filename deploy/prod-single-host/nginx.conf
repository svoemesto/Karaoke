user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

stream {
    # =================================================================
    # BR-545 (аудит #336 / P-73-07, OpenProject #371): L4-прокси ниже идут
    # через ПУБЛИЧНЫЙ интернет БЕЗ TLS.
    #   - 5433 → Postgres прод-хоста: пароль БД и все прод-данные
    #     (tbl_site_users, tbl_subscriptions с yookassa_payment_id) идут
    #     открытым текстом;
    #   - 9000 → MinIO: заголовок Authorization (SigV4-подпись) — открытым
    #     текстом, значит подпись переигровывается в окне действия.
    # allow-list ограничивает, кто ПОДКЛЮЧИТСЯ, но не защищает содержимое.
    #
    # Что сделано в этом пакете (без изменения поведения прода):
    #   1) на сервере Postgres — управляемое переключение TLS:
    #      DB_SSL_ON=on в deploy/prod-single-host/.env (+ сертификаты),
    #      см. deploy/prod-single-host/docker-compose-database.yml;
    #   2) на клиенте — явный sslmode в JDBC-строке:
    #      DB_REMOTE_SSL_MODE=require|verify-full в .env admin-машины
    #      (см. karaoke-app/.../Connection.kt, default = prefer, т.е. как было);
    #   3) для MinIO — TLS на стороне сервера MinIO (MINIO_CERTS_DIR) и
    #      STORAGE_REMOTE_ENDPOINT=https://… в .env admin-машины.
    #
    # Вариант A (TLS через stream-прокси) — раскомментировать в блоке 5433:
    #     listen 5433 ssl;
    #     ssl_certificate     /etc/keys/db-tunnel.crt;
    #     ssl_certificate_key /etc/keys/db-tunnel.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    # Требует модуля ngx_stream_ssl_module (libnginx-mod-stream) и сертификата.
    #
    # Вариант B (туннель) — не трогает этот конфиг вообще: SSH-туннель с
    # admin-машины на loopback прод-хоста (127.0.0.1:15433 → 127.0.0.1:8832)
    # шифрует канал и убирает необходимость публиковать 5433 наружу.
    #
    # Решение «TLS на сервере vs туннель» и установка сертификатов — за
    # владельцем (в отчёте пакета #371 зафиксировано как «за владельцем»).
    # =================================================================
    upstream postgresql_backend {
	server 127.0.0.1:8832;
    }

    server {
	listen 5433;
	proxy_pass postgresql_backend;
	proxy_timeout 300s;
	proxy_responses 1;
	proxy_connect_timeout 10s;
	# Two-DB sync (#165): доступ к прод-БД разрешён admin-машине nsa-i9
	# (её public IP; адрес плавает у провайдера). История адресов:
	# 185.26.28.109 → 83.137.50.231 (2026-09-30) → 185.26.28.199 (2026-10-02)
	# → 87.58.202.244 (2026-10-30, после смены пула у провайдера);
	# все адреса оставлены в списке по слову владельца — при смене
	# адреса доступ не теряется.
	# 95.31.39.146 / 83.137.0.0/16 / 185.191.56.226 — устаревшие,
	# убраны (решение wayfinder #173).
	allow 185.26.28.109;
	allow 83.137.50.231;
	allow 185.26.28.199;
	allow 87.58.202.244;
	deny all;

    }

    # MinIO remote-store для karaoke-app (#165 follow-up, Pass 445).
    # karaoke-app (admin-машина) льёт сюда картинки/аудио для публичного сайта
    # напрямую через MinioClient. MinIO слушает loopback (127.0.0.1:8890, #172),
    # поэтому наружу отдаём L4-прокси на 9000 с allow-list только для admin.
    # L4 (stream) не трогает HTTP/Host → SigV4-подпись MinioClient проходит.
    server {
	listen 9000;
	proxy_pass 127.0.0.1:8890;
	proxy_timeout 300s;
	proxy_connect_timeout 10s;
	allow 185.26.28.109;
	allow 83.137.50.231;
	allow 185.26.28.199;
	allow 87.58.202.244;
	deny all;
    }
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# BR-544 (аудит #336 / P-73-06, OpenProject #371): версия nginx больше
	# не отдаётся клиенту (было закомментировано).
	server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	# BR-544: TLS 1.0/1.1 deprecated (RFC 8996) и не дают AEAD —
	# оставляем только TLS 1.2 и 1.3.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
        client_max_body_size 20M;
}


