# Блокировка модуля ядра SCTP на прод-хосте (nginx2root, 2026-11-18).
#
# Зачем. Цепочка nginx2root состоит из двух частей: RCE в nginx (CVE-2026-123007
# и ещё четыре) и zero-day в SCTP-реализации ядра Linux, который позволяет из
# рабочего процесса nginx получить root на хосте и выйти из Docker-контейнера —
# контейнеры используют общее ядро. Патча на ядро на момент публикации нет.
#
# Наша экспозиция по первой части нулевая: HTTP/2 на прод-хосте и в контейнерах
# выключен (проверено согласованием протокола: curl --http2 → HTTP/1.1), HTTP/3
# не используется, DNS-резолвера с переменным proxy_pass и почтового прокси в
# конфигах нет. Но вторая часть (SCTP) закрывается независимо от nginx и стоит
# нам ничего: SCTP не нужен ни приложению, ни Docker, ни nginx.
#
# Состояние на 19.11.2026: модуль не загружен (lsmod пуст), но загружаем —
# файлы sctp.ko.zst на месте, `modprobe -n sctp` проходил. Этот файл закрывает
# загрузку: ядро откажется загрузить модуль, даже если процесс попросит.
#
# Установка: /etc/modprobe.d/99-karaoke-blocklist-sctp.conf (права 644)
# Проверка:  modprobe sctp  → должен вернуть ошибку; lsmod | grep sctp → пусто
# Откат:     удалить файл (перезагрузка не требуется, если модуль не загружен)

# Любая попытка загрузить модуль заканчивается отказом.
install sctp /bin/false
install sctp_diag /bin/false

# И на случай, если модуль попробуют подтянуть как зависимость.
blacklist sctp
blacklist sctp_diag
