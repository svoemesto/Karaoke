# Pre-commit хуки для Karaoke.
#
# Установка:
#   pip install pre-commit
#   pre-commit install
#
# Запуск вручную (на всех файлах):
#   pre-commit run --all-files
#
# Обход при срочном коммите:
#   git commit --no-verify
#
# Документация: https://pre-commit.com/

repos:
  - repo: local
    hooks:
      # === Guard: GRADLE_USER_HOME (Pass 372, OP #83) ===
      # Ловит ситуацию, когда pre-commit вызывают без export GRADLE_USER_HOME=...
      # и хук ktlint упадёт с read-only FileNotFoundException.
      # См. AGENTS.md § «Gradle: запуск с GRADLE_USER_HOME=/home/nsa/Karaoke/.gradle».
      - id: gradle-user-home-guard
        name: gradle-user-home guard (Pass 372)
        entry: bash tools/check-gradle-user-home.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: DOCKER_CONFIG (Pass 373, OP #83 follow-up) ===
      # Ловит ситуацию, когда docker build выполняется без правильного
      # DOCKER_CONFIG, и buildx падает с read-only в ~/.docker/buildx/activity.
      # См. AGENTS.md § «Docker build: DOCKER_CONFIG=/home/nsa/Karaoke/.docker».
      - id: docker-config-guard
        name: docker-config guard (Pass 373)
        entry: bash tools/check-docker-config.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: container-restart (Pass 374, OP #83 follow-up) ===
      # Ловит прямые `docker restart <container>` / `docker stop <container>` /
      # `docker-compose restart` в shell-файлах (вместо `bash deploy/do.sh restart_*`).
      # См. AGENTS.md § «Перезапуск контейнеров через deploy/do.sh (Pass 374)».
      # Проверяет только .sh/.bash файлы + deploy/do.sh + .github/workflows/.
      # Markdown и ADR НЕ проверяются (там могут быть примеры в документации).
      - id: container-restart-guard
        name: container-restart guard (Pass 374)
        entry: bash tools/check-container-restart.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: frontend-build (Pass 375, OP #83 follow-up) ===
      # Ловит запуск `npm run <cmd>` без `cd webvue3`/`cd karaoke-public` в shell-файлах.
      # См. AGENTS.md § «Frontend build: cd <frontend-dir> && npm run <cmd> (Pass 375)».
      # Проверяет только .sh/.bash файлы + deploy/do.sh + .github/workflows/.
      # Markdown и ADR НЕ проверяются (там могут быть примеры).
      - id: frontend-build-guard
        name: frontend-build guard (Pass 375)
        entry: bash tools/check-frontend-build.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: docker-image-tags (Pass 379, OP #106 follow-up, wayfinder #106) ===
      # R-04 + R-05: `FROM nginx:` и `FROM node:` должны быть в whitelist
      # (nginx:stable, node:22-alpine и т.д.). Ловит запрещённые теги:
      # nginx:alpine (нет bash), nginx:latest, node:alpine, node:latest, node:lts.
      # Source-of-truth: knowledge/guidelines/architecture-conventions.md L20-21,
      # CLAUDE.md § TOP-10 ловушек (п.3 nginx:alpine, п.4 node:latest).
      # Игнорирует backup-файлы (DockerfileOld, DockerfileBackup, DockerfileFull,
      # DockerfileDemucs) — только активные Dockerfile.
      - id: docker-image-tags-guard
        name: docker-image-tags guard (R-04, R-05)
        entry: bash tools/check-docker-image-tags.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: No JPA/Hibernate imports (Pass 379, wayfinder #105) ===
      # Ловит импорты org.springframework.data.jpa|javax.persistence|hibernate в .kt/.java
      # файлах karaoke-app/src/main и karaoke-web/src/main (Constitution Principle II).
      # Тесты (*/test/*) и build-артефакты (*/build/*) исключены.
      - id: no-jpa-imports-guard
        name: no-jpa-imports guard (R-07)
        entry: bash tools/check-no-jpa-imports.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: No MP4 mentions (Pass 379, wayfinder #107) ===
      # R-11 (MP4/скачивание запрет по оферте «доступ только онлайн»).
      # Ловит упоминания \bmp4\b и `скачивани` в production коде (webvue3, karaoke-public, karaoke-app, karaoke-web).
      # Baseline: tools/check-no-mp4-mentions.baseline (125 записей legacy-исключений,
      # сопоставление ПО СОДЕРЖИМОМУ строки, не по номеру — Pass 455;
      # перегенерация: bash tools/check-no-mp4-mentions.sh --update-baseline).
      - id: no-mp4-mentions-guard
        name: no-mp4-mentions guard (R-11)
        entry: bash tools/check-no-mp4-mentions.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: Subagent workspace isolation (Pass 379 follow-up) ===
      # Ловит race condition при параллельных субагентах в одном workspace.
      # Прецедент: PR #484 имел чужой commit `66946300` (JPA) от PR #483.
      # См. AGENTS.md § «Subagent workspace isolation», constitution.md Principle IX.3.
      - id: subagent-isolation-guard
        name: subagent-isolation guard (Pass 379+)
        entry: bash tools/check-subagent-isolation.sh --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # === Guard: экранирование текста подтверждений (спека #558, OP #360, BR-123) ===
      # Общий компонент подтверждения по умолчанию выводит текст как ТЕКСТ,
      # сырая разметка — только при явном `allowHtml: true`. Guard проверяет:
      #   R1 — компонент не принимает сырую разметку по умолчанию;
      #   R2 — `allowHtml: true` объявлен тогда и только тогда, когда в тексте
  #        подтверждения есть статичная разметка;
      #   R3 — пользовательские значения экранированы при сборке текста.
      # Проверка падает на коде до правки (см. tools/check-confirm-escape-fixtures.sh).
      - id: confirm-escape-guard
        name: confirm escape guard (BR-123)
        entry: python3 tools/check-confirm-escape.py
        language: system
        pass_filenames: false
        files: '^webvue3/src/.*\.(vue|js)$|^tools/check-confirm-escape\.py$|^config/frontend/confirm-safe-expressions\.txt$'
        stages: [pre-commit]

      # === Vue: unit-тесты webvue3 (node --test) ===
      # Встроенный раннер Node; тесты лежат в webvue3/src/utils/__tests__/.
      # Спека #558: добавлен escapeHtml.test.js — регресс-контроль «до/после».
      - id: webvue3-unit-tests
        name: unit tests (webvue3 admin SPA)
        entry: bash -c 'cd webvue3 && npm run test:unit'
        language: system
        pass_filenames: false
        files: '^webvue3/src/.*\.(vue|js)$'
        stages: [pre-commit]

      # === Vue: unit-тесты karaoke-public (node --test) ===
      # BR-523 / PKG-S3-02 (аудит #336, OpenProject #387): тесты публичного SPA
      # (src/**/__tests__/*.test.js) не запускались ни в одном хуке и ни в одном
      # CI-джобе — регрессия проходила молча.
      - id: karaoke-public-unit-tests
        name: unit tests (karaoke-public public SPA)
        entry: bash -c 'cd karaoke-public && npm run test:unit'
        language: system
        pass_filenames: false
        files: '^karaoke-public/src/.*\.(vue|js|ts)$'
        stages: [pre-commit]

      # === Guard: тест экранирования метки комментария (BR-523) ===
      # Проверяет, что регрессионный тест «взведён» (падает на уязвимом снимке
      # кода и проходит на исправленном) и что его skip-состояние соответствует
      # состоянию production-кода. Фикстуры «до/после» — tools/fixtures/marker-escape/.
      - id: marker-escape-guard
        name: marker escape guard (BR-523)
        entry: bash tools/check-marker-escape-guard.sh
        language: system
        pass_filenames: false
        files: '^karaoke-public/src/composables/useKaraokeEditor\.js$|^webvue3/src/components/SongEditor/useReviewModalFormat\.js$|^karaoke-public/src/composables/__tests__/formatText-escape\.test\.js$|^webvue3/src/components/SongEditor/__tests__/useReviewModalFormat\.test\.js$|^tools/check-marker-escape-guard\.sh$|^tools/fixtures/marker-escape/'
        stages: [pre-commit]

      # === Kotlin: ktlint ===
      - id: ktlint
        name: ktlint (Kotlin formatter)
        # Pass 372: правило GRADLE_USER_HOME применяется ТРАНЗИТИВНО —
        # этот hook сам вызывает ./gradlew, поэтому ОБЯЗАН передать env var.
        entry: bash -c 'GRADLE_USER_HOME=/home/nsa/Karaoke/.gradle JAVA_HOME=/usr/lib/jvm/jdk-18 ./gradlew ktlintCheck'
        language: system
        pass_filenames: false
        types_or: [kotlin, java]
        # Только когда меняется Kotlin-код
        stages: [pre-commit]

      # === Kotlin: detekt ===
      # Закомментирован до выхода версии с поддержкой Kotlin 2.2
      # (см. AGENTS.md, build.gradle.kts:15-17).
      #  - id: detekt
      #    name: detekt (Kotlin code smells)
      #    entry: ./gradlew detekt
      #    language: system
      #    pass_filenames: false
      #    types_or: [kotlin, java]
      #    stages: [pre-commit]

      # === Vue/TS: eslint (webvue3) ===
      - id: eslint-webvue3
        name: eslint (webvue3 admin SPA)
        entry: bash -c 'cd webvue3 && npm run lint:check'
        language: system
        pass_filenames: false
        files: '^webvue3/.*\.(vue|js|ts)$'
        stages: [pre-commit]

      # === Vue/TS: eslint (karaoke-public) ===
      - id: eslint-karaoke-public
        name: eslint (karaoke-public public SPA)
        entry: bash -c 'cd karaoke-public && npm run lint:check'
        language: system
        pass_filenames: false
        files: '^karaoke-public/.*\.(vue|js|ts)$'
        stages: [pre-commit]

      # === Vue/TS: prettier (webvue3) ===
      - id: prettier-webvue3
        name: prettier (webvue3)
        entry: bash -c 'cd webvue3 && npx prettier --check "src/**/*.{vue,js,ts,json}"'
        language: system
        pass_filenames: false
        files: '^webvue3/.*\.(vue|js|ts|json)$'
        stages: [pre-commit]

      # === Vue/TS: prettier (karaoke-public) ===
      - id: prettier-karaoke-public
        name: prettier (karaoke-public)
        entry: bash -c 'cd karaoke-public && npx prettier --check "src/**/*.{vue,js,ts,json}"'
        language: system
        pass_filenames: false
        files: '^karaoke-public/.*\.(vue|js|ts|json)$'
        stages: [pre-commit]

      # === Markdown: проверка ссылок в документации ===
      - id: verify-doc-links
        name: lychee (verify documentation links)
        entry: ./tools/verify-doc-links.sh
        language: system
        pass_filenames: false
        files: '\.(md|markdown)$'
        stages: [pre-commit]

      # === Markdown: проверка per-feature документов (6 секций, slug, status) ===
      # Проверяются ОБА каталога — живые (docs/features/) и архив
      # (archive/docs/features/). Раньше хук срабатывал только на архиве,
      # поэтому нарушения FR-009 в живых per-feature документах не ловились
      # ни локально, ни в CI (BR-510, P-78-04).
      - id: check-feature-doc
        name: check per-feature document structure
        entry: bash -c './tools/check-feature-doc.sh docs/features/*.md archive/docs/features/*.md'
        language: system
        pass_filenames: false
        files: '^(archive/)?docs/features/.*\.md$'
        stages: [pre-commit]

      # === Markdown: ссылки и упоминания файлов/эндпоинтов в текущей документации ===
      # tools/check-doc-references.py (Pass 491): относительные .md-ссылки,
      # пути к файлам кода и /api-эндпоинты в knowledge/, docs/, archive/docs/.
      # Осознанные исключения — config/knowledge/doc-references-whitelist.txt.
      - id: check-doc-references
        name: check documentation references (links/paths/endpoints)
        entry: python3 tools/check-doc-references.py
        language: system
        pass_filenames: false
        files: '^(knowledge|docs|archive/docs)/.*\.md$'
        stages: [pre-commit]

      # === Kotlin: @Value не должен терять плейсхолдер ===
      # Дефект 2026-10-24 (волна A): `@Value($$"{свойство}")` без '$' внутри кавычек
      # компилируется в литерал `{свойство}` — Spring внедряет текст, и сравнение
      # секретов всегда ложно (на проде синхронизация и капча отклоняли всё).
      - id: check-value-placeholders
        name: check @Value placeholders in Kotlin sources
        entry: bash tools/check-value-placeholders.sh
        language: system
        pass_filenames: false
        files: '^(karaoke-web|karaoke-app)/src/.*\.kt$'
        stages: [pre-commit]

      # === Field coverage: SongEdit ↔ /song/update ===
      # specs/302-fix-censored-name-loss FR-005/006 — ловит баг "UI шлёт X, бэкенд не принимает".
      - id: songedit-field-coverage
        name: SongEdit field coverage (SongEdit.vue ↔ /api/song/update)
        entry: bash tools/check-songedit-field-coverage.sh
        language: system
        pass_filenames: false
        files: '^webvue3/src/components/Songs/edit/SongEdit\.vue$|^karaoke-app/src/main/kotlin/.*ApiController\.kt$|^karaoke-app/src/main/kotlin/.*SongUpdateMapper\.kt$|^tools/check-songedit-field-coverage\.'
        stages: [pre-commit]

      # === Field coverage: все пары UI↔backend ===
      # specs/302-fix-censored-name-loss FR-007/008 — общий аудит всех пар из endpoint-pairs.yml.
      - id: endpoint-field-coverage
        name: Endpoint field coverage (все пары UI↔backend)
        entry: bash tools/check-endpoint-field-coverage.sh
        language: system
        pass_filenames: false
        files: '^(webvue3|karaoke-public)/.*\.(vue|js|ts)$|^karaoke-app/src/main/kotlin/.*\.kt$|^tools/check-endpoint-field-coverage\.|^tools/endpoint-pairs\.yml$'
        stages: [pre-commit]

      # === Git workflow: блокировать commit в master/main (Pass 353) ===
      # Client-side layer защиты. Главная — GitHub branch protection (server-side, admin-enforced).
      # Этот hook ловит ошибку ДО push.
      - id: block-master-commit
        name: Block direct commits to master/main (AGENTS.md § Git — CI-gate для master)
        entry: bash tools/git-hooks/pre-commit-block-master.sh
        language: system
        pass_filenames: false
        always_run: true   # Всегда, не только при изменениях файлов
        stages: [pre-commit]

# Общие настройки
fail_fast: false   # Прогоняем все хуки даже если один упал — даём полный отчёт
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
