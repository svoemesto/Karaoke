user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;

  server {
    listen       7907;
    # BR-550 (аудит #336 / P-73-12, OpenProject #393): было 1024m — гигабайтное тело
    # запроса для неаутентифицированного публичного контура. Фактический потолок продукта —
    # spring.servlet.multipart.max-file-size в karaoke-web/application.yml (200MB, загрузка
    # аудио для премиум-«минусовки»), и host-nginx уже режет /api/ на 200m
    # (deploy/prod-single-host/nginx.conf, 80to8897). 1024m был латентной ошибкой: при смене
    # способа публикации (или доступе из deploy_karaokenet) тело до 1 ГБ буферизовалось бы на
    # хосте. Теперь лимит равен реальному и продублирован в host-nginx.
    client_max_body_size 200m;
    server_name  localhost;

    # BR-549 (аудит #336 / P-73-11, OpenProject #393): защитные заголовки. Раньше их не было
    # ни в этом конфиге, ни в host-nginx (host исправлен в #372/BR-558). HSTS здесь не нужен:
    # TLS терминирует host-nginx (80to8897) и он уже отдаёт Strict-Transport-Security для
    # всего хоста — политика HSTS действует на хост целиком, дубль в контейнере не требуется.
    # `always` — чтобы заголовки были и на 4xx/5xx.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }

    # karaoke-web слушает WEB_PORT_HOST/WEB_PORT_INSIDE_CONTAINER (deploy/do.env).
    # Если karaoke-web запущен в том же docker compose проекте/сети — можно заменить
    # "karaoke-web:7799" на адрес из nginx_webvue3.conf (там используется LAN IP хоста).
    location /api/public {
       expires -1;
       add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
       # BR-549: свои add_header перекрывают наследование — набор повторяется явно.
       add_header X-Frame-Options "SAMEORIGIN" always;
       add_header X-Content-Type-Options "nosniff" always;
       add_header Referrer-Policy "strict-origin-when-cross-origin" always;
       proxy_pass http://karaoke-web:7799;
       proxy_set_header X-Forwarded-For-Client $proxy_add_x_forwarded_for;
    }

    location /api/storage {
       expires -1;
       add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
       # BR-549: свои add_header перекрывают наследование — набор повторяется явно.
       add_header X-Frame-Options "SAMEORIGIN" always;
       add_header X-Content-Type-Options "nosniff" always;
       add_header Referrer-Policy "strict-origin-when-cross-origin" always;
       proxy_pass http://karaoke-web:7799;
       proxy_set_header X-Forwarded-For-Client $proxy_add_x_forwarded_for;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
