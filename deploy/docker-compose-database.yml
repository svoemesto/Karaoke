version: "3.9"
services:
  karaoke-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_LOCAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: "karaoke"
      PGDATA: "/var/lib/postgresql/data/16"
      WORK_IN_CONTAINER: 1
      # specs/288-prod-diagnostics-logging: TZ для контейнера karaoke-db. Без этого PostgreSQL
      # пишет в лог UTC (дефолт Docker), что усложняет корреляцию с логами nginx (MSK) и
      # Spring Boot (UTC → MSK после FR-010). Применяется при следующем `docker-compose up --force-recreate`;
      # для уже работающего контейнера — `ALTER SYSTEM SET log_timezone = 'Europe/Moscow'` (FR-007)
      # работает без рестарта на SQL-уровне.
      TZ: Europe/Moscow
    container_name: karaoke-db
    ports:
      - "127.0.0.1:${DB_PORT_HOST}:${DB_PORT_INSIDE_CONTAINER}" # порт хоста : порт внутри контейнера
    networks:
      - karaokenet
    volumes: # локальная папка : папка внутри контейнера
      - ${DB_FOLDER}:/var/lib/postgresql/data/16 # мапим локальную папку /sm-karaoke/system/Караоке-db в контейнер по пути /var/lib/postgresql/data/16
      - ./karaoke-db:/docker-entrypoint-initdb.d # мапим папку karaoke-db из текущего каталога (deploy) в контейнер по пути docker-entrypoint-initdb.d - из нее будут запускаться скрипты для инициализации бд
    restart: always

networks:
  karaokenet:
    external: true # <-- Указываем, что сеть внешняя
