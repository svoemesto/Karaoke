- insert:
    - id: agent-command-guard
      name: '@local/agent-command-guard'
      config:
        # Режим по умолчанию для правил без собственного "mode":
        #   ask  — спросить владельца (тот же канал одобрения, что у эскалаций
        #          песочницы; при его отсутствии вызов запрещается);
        #   deny — запретить без вопроса (для узких проверенных классов).
        # Финальный перечень правил и режимов — KARAOKE-343.
        mode: ask
        # Писать в журнал ВСЕ вызовы bash, а не только совпавшие: журнал —
        # источник следов, и «нет записи» должно означать «не было вызова».
        logAll: true
        # Пути не заданы: плагин берёт их из DSH_GUARD_POLICY / DSH_GUARD_JOURNAL /
        # DSH_GUARD_CONSENT_DIR, иначе — ~/.dsh/policies/deny-commands.json,
        # ~/.dsh/ledger/agent-commands.ndjson и ~/.dsh/policies/consent.
