version: "3.9"
services:

  karaoke-web:
    container_name: karaoke-web
    # BR-042 (аудит #336 / P-70-04, OpenProject #393): тег — из IMAGE_TAG, а не литерал :1.
    # IMAGE_TAG экспортирует do.sh (собранный/скачанный тег); без него — 1 (прежнее поведение).
    image: ${DOCKER_REGISTRY}/karaoke-web:${IMAGE_TAG:-1}
    ports:
      # Наружу — только host-nginx (443/80); karaoke-web слушает loopback (#173).
      - "127.0.0.1:${WEB_PORT_HOST}:${WEB_PORT_INSIDE_CONTAINER}"
    environment:
      - WORK_ON_SERVER=1
      - WORK_IN_CONTAINER=1
      - STORAGE_FOLDER=${STORAGE_FOLDER}
      - STORAGE_PORT_HOST=${STORAGE_PORT_HOST}
      - STORAGE_PORT_INSIDE_CONTAINER=${STORAGE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONSOLE_PORT_HOST=${STORAGE_CONSOLE_PORT_HOST}
      - STORAGE_CONSOLE_PORT_INSIDE_CONTAINER=${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONTAINER_NAME=${STORAGE_CONTAINER_NAME}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_SECRET=${STORAGE_SECRET}
      - DB_LOCAL_POSTGRES_USER=${DB_LOCAL_POSTGRES_USER}
      - DB_LOCAL_POSTGRES_PASSWORD=${DB_LOCAL_POSTGRES_PASSWORD}
      - DB_SERVER_POSTGRES_USER=${DB_SERVER_POSTGRES_USER}
      - DB_SERVER_POSTGRES_PASSWORD=${DB_SERVER_POSTGRES_PASSWORD}
      - DB_REMOTE_HOST=${DB_REMOTE_HOST}
      - DB_REMOTE_PORT=${DB_REMOTE_PORT}
      # BR-545/BR-557: режим TLS удалённой БД (prefer|require|verify-full).
      # По умолчанию prefer — как было. Целевое состояние — require/verify-full
      # после включения TLS на сервере БД (DB_SSL_ON на прод-хосте).
      - DB_REMOTE_SSL_MODE=${DB_REMOTE_SSL_MODE:-prefer}
      # Обход MTU black-hole для внешних HTTPS-вызовов (см. 80to8897 location /smartcaptcha/) —
      # тот же приём, что STORAGE_PROXY_URL для MinIO.
      - CAPTCHA_PROXY_URL=http://minio-proxy/smartcaptcha
      # Тот же приём для ЮKassa API (80to8897 location /yookassa/). shop-id/secret-key — реальные
      # значения из do.env на сервере (НЕ коммитить сюда, см. CLAUDE.md про секреты в do.sh/do.env).
      - YOOKASSA_API_URL=http://minio-proxy/yookassa
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - STEMJOBS_INTERNAL_SECRET=${STEMJOBS_INTERNAL_SECRET}
      # Каталог, куда karaoke-web складывает принятые приватные объекты премиум-задания
      # (спека 561, OpenProject #361). Должен лежать НА постоянном томе (${WEB_FOLDER_HOST}
      # монтируется в контейнер) — иначе результаты исчезают при перезапуске контейнера.
      # По умолчанию в application.yml — /tmp/stemjobs/results (не переживает рестарт).
      - STEMJOBS_RESULT_DIR=${STEMJOBS_RESULT_DIR}
      # Секрет заголовка X-Internal-Secret для эндпоинта двуx-БД синхронизации
      # POST /changerecords (karaoke-web → sync.internal-secret). Пусто = доступ закрыт (fail-safe).
      - SYNC_INTERNAL_SECRET=${SYNC_INTERNAL_SECRET}
      # Серверный (секретный) ключ проверки капчи Yandex SmartCaptcha (спека 564, OpenProject #362).
      # Раньше лежал в публично изменяемой таблице tbl_public_settings — анонимный клиент мог его
      # обнулить, и проверка капчи становилась fail-open. Теперь ключ только здесь (env), а при
      # незаконной конфигурации регистрация отклоняется (fail-closed).
      - CAPTCHA_SERVER_KEY=${CAPTCHA_SERVER_KEY}
      - VK_CLIENT_SECRET=${VK_CLIENT_SECRET}
      - VK_APP_ID=${VK_APP_ID}
      - VK_REDIRECT_URI=${VK_REDIRECT_URI}
      - VK_ID_CLIENT_ID=${VK_ID_CLIENT_ID}
      - VK_ID_CLIENT_SECRET=${VK_ID_CLIENT_SECRET}
      - VK_ID_REDIRECT_URI=${VK_ID_REDIRECT_URI}
      - VK_ID_ADMIN_API_URL=${VK_ID_ADMIN_API_URL}
      # Прокси к MinIO через хостовый nginx (fetchFromMinIO/existsInMinIO в PublicApiController/
      # PublicPlayerController). @Value("${storage.proxy-url}") требует это значение; application.yml
      # в jar не упаковывается, поэтому property приходит только отсюда (иначе karaoke-web не стартует).
      - STORAGE_PROXY_URL=http://minio-proxy
    volumes:
      - ${WEB_FOLDER_HOST}:${WEB_FOLDER_IN_CONTAINER}
      # BR-547 (аудит #336 / P-73-09, OpenProject #393): -XX:HeapDumpPath=/dumps указывал
      # в каталог, которого в контейнере не было (в volumes был только WEB_FOLDER) — при OOM
      # дамп не писался, и диагностика падения терялась. Каталог тот же, что у karaoke-db
      # (./karaoke-db/dumps, монтируется в docker-compose-database.yml).
      - ./karaoke-db/dumps:/dumps
    extra_hosts:
      - "minio-proxy:host-gateway"
    networks:
      - karaokenet
    entrypoint:
      - java
      - -Dfile.encoding=UTF-8
      - -Djava.security.egd=file:/dev/./urandom
      - -XX:+HeapDumpOnOutOfMemoryError
      - -XX:HeapDumpPath=/dumps
    command: ${APP_JAVA_OPTS} -jar /app.jar
    restart: always
    # BR-547: healthcheck + cgroup-потолок. Раньше healthcheck не было вовсе: `restart: always`
    # перезапускает только УПАВШИЙ процесс, а «зависший» karaoke-web (JVM жива, HTTP не отвечает)
    # оставался Up без сигнала мониторингу. Лимитов памяти/CPU тоже не было: на хосте 3.8 ГБ
    # karaoke-web с -Xmx1200m (APP_JAVA_OPTS) + Postgres + MinIO не имели потолка, и хостовый
    # OOM-killer мог выбрать контейнер БД.
    #
    # healthcheck дергает публичный read-only эндпоинт (authors-tiles читает кэш/БД, побочных
    # эффектов не пишет; /api/public/stats НЕ подходит — он регистрирует событие в tbl_events).
    # bash есть в образе (eclipse-temurin:22-jre-jammy). $$line — чтобы compose не подставлял
    # переменную сам.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${WEB_PORT_INSIDE_CONTAINER:-7799}; printf \"GET /api/public/authors-tiles HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r line <&3; case \"$$line\" in *\" 200 \"*) exit 0;; esac; exit 1'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    # -Xmx1200m (см. deploy/prod-single-host/.env.example, APP_JAVA_OPTS) + запас на metaspace,
    # потоки и нативную память.
    mem_limit: 1600m
    cpus: 2.0
    # BR-546 (аудит #336 / P-73-08, OpenProject #371): ротация логов.
    # Без max-size/max-file json-file драйвер растёт, пока не забьёт диск
    # прод-хоста (985 ГБ): Postgres перестаёт писать ("No space left on device"),
    # сайт не отвечает — инцидент 2026-07-09. Раньше ротация была только
    # у registry (deploy/prod-single-host/docker-compose-registry.yml).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  karaokenet:
    external: true
    name: deploy_karaokenet
