version: "3.9"
services:

  karaoke-app:
    container_name: karaoke-app
    image: svoemestodev/karaoke-app:1
    ports:
      - "8898:8899"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WORK_ON_SERVER=0
      - WORK_IN_CONTAINER=1
      - STORAGE_FOLDER=${STORAGE_FOLDER}
      - STORAGE_PORT_HOST=${STORAGE_PORT_HOST}
      - STORAGE_PORT_INSIDE_CONTAINER=${STORAGE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONSOLE_PORT_HOST=${STORAGE_CONSOLE_PORT_HOST}
      - STORAGE_CONSOLE_PORT_INSIDE_CONTAINER=${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONTAINER_NAME=${STORAGE_CONTAINER_NAME}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_SECRET=${STORAGE_SECRET}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - CORS_ALLOWED_ORIGINS=http://localhost:7906,http://127.0.0.1:7906
      # APP_MAX_FILE_SIZE удалён 2026-09-30: он перекрывал app.max-file-size,
      # но это поле в коде никогда не читалось, и файл с настройками тем самым
      # врал о лимите загрузки. Настоящий лимит — spring.servlet.multipart
      # в karaoke-app/src/main/resources/application.yml.
      - DB_LOCAL_POSTGRES_USER=${DB_LOCAL_POSTGRES_USER}
      - DB_LOCAL_POSTGRES_PASSWORD=${DB_LOCAL_POSTGRES_PASSWORD}
      - DB_SERVER_POSTGRES_USER=${DB_SERVER_POSTGRES_USER}
      - DB_SERVER_POSTGRES_PASSWORD=${DB_SERVER_POSTGRES_PASSWORD}
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/.Xauthority
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SEARXNG_BASE_URL=http://searxng:8080
      - LYRICS_SEARCH_BASE_URL=http://fourget:80
    volumes:
      - /sm-karaoke/work:/sm-karaoke/work
      - /sm-karaoke/done1:/sm-karaoke/done1
      - /sm-karaoke/done2:/sm-karaoke/done2
      - /sm-karaoke/system:/sm-karaoke/system
      - /sm-karaoke/store:/sm-karaoke/store
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/Karaoke/karaoke-web/src/main/resources/static/tmp:~/Karaoke/karaoke-web/src/main/resources/static/tmp
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/.Xauthority:rw
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - karaokenet # Используем внешнюю сеть
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu", "utility", "compute", "video"]
    entrypoint:
      - java
      - -Xmx2g
    command: -jar /app.jar
    # BR-560 (аудит #336 / P-72-08, OpenProject #393): политика перезапуска, потолок
    # ресурсов и healthcheck.
    #
    # Было: ни `restart:`, ни `healthcheck`, а в deploy.resources был только
    # reservations.devices (GPU) без limits. do_start_app поднимал karaoke-app независимо от
    # готовности БД/хранилища; упавшее на старте приложение не поднималось само, а память
    # контейнера (JVM 2 ГБ + нативная: Playwright/Chromium, MLT, метаспейс, потоки) не была
    # ограничена cgroup'ом — при пике хостовый OOM-killer мог убить БД, а не приложение.
    #
    # `depends_on` между файлами compose невозможен (db/storage/app — отдельные файлы и
    # отдельные `docker-compose up`), поэтому готовность БД/хранилища закрывается политикой
    # перезапуска: приложение падает на старте и перезапускается, пока зависимости не поднимутся.
    restart: unless-stopped
    # -Xmx2g в entrypoint + запас на metaspace/потоки/нативные библиотеки.
    mem_limit: 3g
    cpus: 4.0
    healthcheck:
      # HTTP-эндпоинта «готов» у karaoke-app нет, поэтому проверяем, что приложение слушает
      # свой порт (application.yml: server.port=8899). bash есть в образе (ubuntu:22.04).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8899'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng-settings:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # BR-040 (аудит #336 / P-70-02, OpenProject #371): секрет НЕ в git.
      # Значение — в deploy/do.env (в .gitignore) или deploy/.env;
      # шаблон — deploy/do.env.example.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET is required (set in deploy/do.env or deploy/.env)}
    restart: unless-stopped
    networks:
      - karaokenet

  # Замена поискового бэкенда для текстов песен (specs/014-lyrics-search-replacement) —
  # см. комментарий в deploy/docker-compose.yml. searxng выше не трогаем (нужен для
  # обложек альбомов).
  fourget:
    image: luuul/4get:1.0.44
    container_name: fourget
    ports:
      - "8889:80"
    environment:
      - FOURGET_PROTO=http
      - FOURGET_SERVER_NAME=fourget
    restart: unless-stopped
    networks:
      - karaokenet

networks:
  karaokenet:
    external: true # <-- Указываем, что сеть внешняя