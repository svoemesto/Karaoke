version: '3.8'

# Whisper ASR (распознавание вокала для авто-маркеров, см. WhisperAsrService.kt/AGENTS.md) -
# hwdsl2/whisper-server сам умеет скачивать модель по имени в WHISPER_MODEL (faster-whisper/
# huggingface_hub внутри образа уже знает правильные репозитории и заголовки авторизации для
# каждого имени модели, включая нестандартные вроде large-v3-turbo) - отдельный кастомный
# загрузчик тут больше не нужен (было: whisper-downloader + download_model.py - убраны после
# серии проблем: не тот репозиторий на HF, отсутствие Authorization-заголовка, IPv6 без
# маршрута в контейнере - образ решает всё это сам, надёжнее, чем самодельная реализация).

services:
  # GPU-версия Whisper (основная, быстрая)
  whisper-asr:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper-asr
    restart: always
    init: true
    # Обычный docker0/"bridge" вместо отдельной Compose-сети проекта (которую Compose создаёт
    # по умолчанию, если не указан networks:) - на этой машине именно кастомные Compose-сети (не
    # docker0) не могли достучаться наружу (DNS/HTTPS таймауты), а простой "docker run --rm
    # alpine" (который как раз использует docker0) работал без проблем. Похоже на несовпадение
    # MTU между VPN-туннелем хоста и кастомным bridge (VPN режет MTU, кастомная Compose-сеть
    # использует MTU 1500 по умолчанию - крупные пакеты молча теряются).
    network_mode: bridge
    ports:
      - "8015:9000"
    environment:
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_ENGINE=faster-whisper
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_API_KEY=nafanya_whisper_2026
      - HF_TOKEN=hf_key
    # Docker-мост не всегда получает рабочий DNS от хоста (VPN/локальный резолвер могут
    # возвращать адреса, недоступные из контейнера) - см. тот же приём в docker-compose-ollama.yml
    # для другого GPU-контейнера, которому тоже нужен внешний интернет.
    dns:
      - 1.1.1.1 # Cloudflare DNS
      - 8.8.4.4 # Google DNS (альтернативный)
      - 77.88.8.8 # Яндекс DNS (если вы в РФ)
    volumes:
      - ./whisper_models:/var/lib/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/v1/models')"]
      interval: 30s
      timeout: 10s
      # Первый старт скачивает модель (может занять несколько минут) - до первого успешного
      # health-check'а retries*interval должно этого хватать с запасом.
      retries: 20
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU-версия Whisper (fallback, если GPU не справился с VRAM)
  whisper-asr-cpu:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper-asr-cpu
    restart: always
    init: true
    # Дожидаемся, пока GPU-версия скачает и загрузит модель - оба сервиса делят один volume с
    # кешем моделей, не нужно тянуть одну и ту же модель по сети дважды параллельно при первом
    # старте (huggingface_hub внутри образа, скорее всего, безопасен для параллельного доступа
    # к кешу за счёт файловых локов, но зачем без нужды удваивать сетевую нагрузку).
    depends_on:
      whisper-asr:
        condition: service_healthy
    network_mode: bridge
    ports:
      - "8016:9000"
    environment:
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_ENGINE=faster-whisper
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_API_KEY=nafanya_whisper_2026
      - HF_TOKEN=hf_key
    dns:
      - 1.1.1.1 # Cloudflare DNS
      - 8.8.4.4 # Google DNS (альтернативный)
      - 77.88.8.8 # Яндекс DNS (если вы в РФ)
    volumes:
      - ./whisper_models:/var/lib/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/v1/models')"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    # CPU не требует GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 0
              capabilities: [gpu]
