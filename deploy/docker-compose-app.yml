version: "3.9"
services:

  karaoke-app:
    container_name: karaoke-app
    # init: true — docker ставит в контейнер docker-init (tini) как PID 1. Без него PID 1 — сам
    # java, а JVM пожинает только те процессы, что запустила сама: осиротевшие после рендера
    # headless_shell (родитель — драйвер Playwright, умирающий раньше браузера) перевешиваются
    # на PID 1 и остаются зомби навсегда. Замер 2026-10-15: 3477 зомби за ~1.7 суток работы
    # контейнера (issue #304). Тот же эффект — для любых других осиротевших детей.
    init: true
    image: ${DOCKER_REGISTRY}/karaoke-app:${BUILD_VERSION}
    ports:
      - ${APP_PORT_HOST}:${APP_PORT_INSIDE_CONTAINER}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LANG=C.utf8
      - LC_ALL=C.utf8
      - WORK_IN_CONTAINER=1
      - STORAGE_FOLDER=${STORAGE_FOLDER}
      - STORAGE_PORT_HOST=${STORAGE_PORT_HOST}
      - STORAGE_PORT_INSIDE_CONTAINER=${STORAGE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONSOLE_PORT_HOST=${STORAGE_CONSOLE_PORT_HOST}
      - STORAGE_CONSOLE_PORT_INSIDE_CONTAINER=${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONTAINER_NAME=${STORAGE_CONTAINER_NAME}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_SECRET=${STORAGE_SECRET}
      # Pass 445 (#165 follow-up): remote-store endpoint для karaoke-app.
      # Без явного проброса брался устаревший дефолт application.yml
      # (89.125.103.63) → karaoke-app заливал картинки в старый MinIO,
      # а прод читал из нового → картинки не показывались.
      - STORAGE_REMOTE_ENDPOINT=${STORAGE_REMOTE_ENDPOINT}
      - DB_LOCAL_POSTGRES_USER=${DB_LOCAL_POSTGRES_USER}
      # Ключ шифрования служебных полей между сервисами (sqlToInsert/sqlToDelete и кодовое
      # слово). Секрет живёт только в окружении (deploy/do.env, вне git) — в коде его нет.
      # Ключ и IV должны быть ОДИНАКОВЫМИ у karaoke-app (шифрует) и karaoke-web (расшифровывает).
      - CRYPTO_AES_KEY=${CRYPTO_AES_KEY}
      - CRYPTO_AES_IV=${CRYPTO_AES_IV}
      - DB_LOCAL_POSTGRES_PASSWORD=${DB_LOCAL_POSTGRES_PASSWORD}
      - DB_SERVER_POSTGRES_USER=${DB_SERVER_POSTGRES_USER}
      - DB_SERVER_POSTGRES_PASSWORD=${DB_SERVER_POSTGRES_PASSWORD}
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/.Xauthority
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SEARXNG_BASE_URL=http://searxng:8080
      - LYRICS_SEARCH_BASE_URL=http://fourget:80
      - DB_REMOTE_PORT=5433
      # wayfinder #165/#175: проброс host'а прод-БД. Без этой строки karaoke-app
      # использовал дефолт application.yml (устаревший IP), а DB_REMOTE_HOST
      # из deploy/.env игнорировался (баг обнаружен при переезде).
      - DB_REMOTE_HOST=${DB_REMOTE_HOST}
      # BR-545/BR-557: режим TLS удалённой БД (prefer|require|verify-full).
      # По умолчанию prefer — как было (драйвер сам деградирует в открытый текст,
      # если сервер без TLS). Целевое состояние — require/verify-full после
      # включения TLS на сервере (DB_SSL_ON на прод-хосте).
      - DB_REMOTE_SSL_MODE=${DB_REMOTE_SSL_MODE:-prefer}
      # Спека 733 (FR-011, FR-012): клиентский сертификат для mTLS-доступа
      # к прод-БД. Пусто — mTLS не используется (прежнее поведение).
      # Файлы лежат в смонтированном secret-каталоге (права 600).
      - DB_REMOTE_SSL_CERT=${DB_REMOTE_SSL_CERT:-}
      - DB_REMOTE_SSL_KEY=${DB_REMOTE_SSL_KEY:-}
      - DB_REMOTE_SSL_ROOT_CERT=${DB_REMOTE_SSL_ROOT_CERT:-}
      # Спека 733 (FR-001, FR-027): постоянный туннель к проду (WireGuard).
      # PROD_TUNNEL_ENABLED=false — туннель выключен, приложение работает по
      # публичному пути (прежнее поведение). При true приложение само поднимает
      # интерфейс wg0, следит за рукопожатием и восстанавливает туннель.
      - PROD_TUNNEL_ENABLED=${PROD_TUNNEL_ENABLED:-false}
      - PROD_TUNNEL_INTERFACE=${PROD_TUNNEL_INTERFACE:-wg0}
      - PROD_TUNNEL_SECRET_DIR=/run/karaoke/tunnel
      - PROD_TUNNEL_PRIVATE_KEY_PATH=${PROD_TUNNEL_PRIVATE_KEY_PATH:-/run/karaoke/tunnel/tunnel.key}
      - PROD_TUNNEL_LOCAL_ADDRESS=${PROD_TUNNEL_LOCAL_ADDRESS:-10.77.0.1/24}
      - PROD_TUNNEL_PEER_ADDRESS=${PROD_TUNNEL_PEER_ADDRESS:-10.77.0.2/24}
      - PROD_TUNNEL_PEER_PUBLIC_KEY=${PROD_TUNNEL_PEER_PUBLIC_KEY:-}
      - PROD_TUNNEL_ENDPOINT=${PROD_TUNNEL_ENDPOINT:-188.127.240.124:51820}
      - PROD_TUNNEL_KEEPALIVE=${PROD_TUNNEL_KEEPALIVE:-25}
      - PROD_TUNNEL_HANDSHAKE_TIMEOUT=${PROD_TUNNEL_HANDSHAKE_TIMEOUT:-180}
      - PROD_TUNNEL_CHECK_INTERVAL=${PROD_TUNNEL_CHECK_INTERVAL:-30}
      - PROD_TUNNEL_PROD_HOST=${PROD_TUNNEL_PROD_HOST:-10.77.0.2}
      - PROD_TUNNEL_DNS_OVERRIDE_HOST=${PROD_TUNNEL_DNS_OVERRIDE_HOST:-sm-karaoke.ru}
      - PROD_TUNNEL_FALLBACK_ENABLED=${PROD_TUNNEL_FALLBACK_ENABLED:-true}
      - PROD_TUNNEL_MAX_CHANNEL_RETRIES=${PROD_TUNNEL_MAX_CHANNEL_RETRIES:-3}
      # BR-630 (спека 676, FR-015): пороги алерта загрузки heap JVM — 75 %
      # (предупреждение) и 90 % (критический уровень), % от максимума heap.
      # Конфигурация, а не код (ADR local-0001): значения видны здесь, рядом с
      # mem_limit/-Xmx6g, и проверяются guard'ом BR-630.
      - MONITOR_HEAP_WARN_PERCENT=75
      - MONITOR_HEAP_CRITICAL_PERCENT=90
    volumes:
      - ${APP_FOLDER_HOST}:${APP_FOLDER_IN_CONTAINER}
      - ${APP_FOLDER_K1}:${APP_FOLDER_K1}
      - ${APP_FOLDER_K2}:${APP_FOLDER_K2}
      - ${APP_FOLDER_K3}:${APP_FOLDER_K3}
      - ${APP_FOLDER_SYSTEM}:${APP_FOLDER_SYSTEM}
      - ${APP_FOLDER_STORE}:${APP_FOLDER_STORE}
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/.Xauthority:rw
      - /etc/localtime:/etc/localtime:ro
      # specs/401-followup-nvidia (#126, Pass 401): docker.sock нужен для запуска
      # demucs из karaoke-app (см. Song.argsDemucs2 — ProcessBuilder "docker run
      # svoemestodev/demucs:latest"). Без socket получаем:
      #   failed to connect to the docker API at unix:///var/run/docker.sock
      # Прецедент 2026-09-16: после обновления nvidia-драйверов контейнер
      # пересоздался через deploy/do.sh, compose-файл не содержал docker.sock,
      # и demucs перестал работать. Восстановлено добавлением этого volume.
      - /var/run/docker.sock:/var/run/docker.sock
      # BR-630 (FR-009/FR-010): том дампов heap. Тот же каталог, что у karaoke-db
      # (BR-046: ./karaoke-db/dumps) — дамп переживает перезапуск контейнера и
      # читается с хоста. Политика хранения (последние 2, ≤ 20 ГБ, вытеснение по
      # возрасту) — deploy/heap-dump-retention.sh.
      - ./karaoke-db/dumps:/dumps
      # Спека 733 (FR-013, FR-030): каталог с ключом туннеля и сертификатами
      # для mTLS к прод-БД. Монтируется read-only; содержимое — вне репозитория
      # (на хосте: /etc/karaoke/tunnel, права 700, файлы 600).
      # Каталог может отсутствовать — тогда туннель не поднимется (TUNNEL-002,
      # причина no_key), а приложение продолжит работать по публичному пути.
      - ${TUNNEL_SECRET_DIR_HOST:-/etc/karaoke/tunnel}:/run/karaoke/tunnel:ro
    devices:
      - /dev/dri:/dev/dri
      # Спека 733 (FR-027): туннель к проду (WireGuard) поднимает САМО
      # приложение — интерфейс wg0 живёт в сетевом пространстве этого
      # контейнера. Для этого нужны NET_ADMIN и устройство /dev/net/tun.
      # Приватный ключ приходит монтированием из secret-каталога (600) и
      # приложением НЕ читается (его получает `wg` по пути файла) — FR-030.
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    # ip_forward нужен, чтобы трафик хоста админской машины (DBeaver → 10.77.0.2)
    # проходил через контейнер в туннель с тем же постоянным адресом назначения
    # и тем же адресом источника 10.77.0.1 — FR-031, FR-032.
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      - karaokenet
    # BR-630 (спека 676, FR-006/FR-007): предел памяти контейнера karaoke-app.
    #   Пара «heap ↔ предел» видна в репозитории: максимум heap JVM — 6 ГБ
    #   (-Xmx6g в команде ниже), предел памяти контейнера — 8 ГБ (mem_limit).
    #   Запас ~2 ГБ на метапространство, native-память и потоки.
    #   Прецедент 2026-10-23: JVM с -Xmx8g без cgroup-лимита вытесняла память
    #   admin-машины (хост уходил в swap, соседние сервисы страдали) — из-за этого
    #   погиб HttpClient-монитор и 5+ часов держался ложный CRITICAL «прод
    #   недоступен» при живом прод-сайте.
    mem_limit: 8g
    entrypoint:
      - java
      - -Dfile.encoding=UTF-8
      - -Djava.security.egd=file:/dev/./urandom
    # BR-630 (FR-007/FR-008): -Xmx6g стоит ПОСЛЕ ${APP_JAVA_OPTS} — последний -Xmx
    #   побеждает (проверено: java -Xmx8g -Xmx6g → MaxHeapSize = 6442450944 = 6 GiB).
    #   Так перекрывается устаревшее -Xmx8g из неотслеживаемого deploy/.env, и связь
    #   «heap меньше предела контейнера» проверяется из репозитория, а не только
    #   по значению в .env, которого в git нет.
    #
    # FR-009: дамп состояния heap при исчерпании памяти пишется на том /dumps
    #   (тот же приём, что у прод-karaoke-web — BR-547).
    command: ${APP_JAVA_OPTS} -Xmx6g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps -jar /app.jar

  searxng:
    image: sm-karaoke.ru:5443/mirror/searxng/searxng:latest@sha256:f3e639582391a481a7a9965d8a3611319cc8561f03929277cca0a8b4cd610830
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng-settings:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # BR-040 (аудит #336 / P-70-02, OpenProject #371): секрет НЕ в git.
      # Значение — в deploy/do.env (в .gitignore) или deploy/.env;
      # шаблон — deploy/do.env.example.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET is required (set in deploy/do.env or deploy/.env)}
    restart: unless-stopped
    networks:
      - karaokenet

  # Замена поискового бэкенда для текстов песен (specs/014-lyrics-search-replacement) —
  # см. комментарий в deploy/docker-compose.yml. searxng выше не трогаем (нужен для
  # обложек альбомов).
  fourget:
    image: sm-karaoke.ru:5443/mirror/luuul/4get:1.0.44@sha256:a7b0806812fc682afa957f0a214c7bc3d4aebad775fa28d6ec1993209833b5ab
    container_name: fourget
    ports:
      - "8889:80"
    environment:
      - FOURGET_PROTO=http
      - FOURGET_SERVER_NAME=fourget
    restart: unless-stopped
    networks:
      - karaokenet

networks:
  karaokenet:
    external: true # <-- Указываем, что сеть внешняя

