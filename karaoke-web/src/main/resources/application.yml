server:
  port: 7799

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  thymeleaf:
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
    cache: false
  main:
    allow-bean-definition-overriding: true

WORK_IN_CONTAINER: 0
work-in-container: ${WORK_IN_CONTAINER}
work-on-server: ${WORK_ON_SERVER}
db-local-postgres-user: ${DB_LOCAL_POSTGRES_USER}
db-local-postgres-password: ${DB_LOCAL_POSTGRES_PASSWORD}
db-remote-postgres-user: ${DB_SERVER_POSTGRES_USER}
db-remote-postgres-password: ${DB_SERVER_POSTGRES_PASSWORD}
db-remote-host: ${DB_REMOTE_HOST:188.119.64.111}
db-remote-port: ${DB_REMOTE_PORT:8832}

app:
  max-file-size: 100MB
  max-request-size: 100MB
  # Базовый URL публичного сайта (karaoke-public SPA) — нужен для return_url редиректа ЮKassa после
  # оплаты (PublicSubscriptionController). Локально бьёт на дев-сервер Vite по умолчанию.
  public-site-url: ${PUBLIC_SITE_URL:https://sm-karaoke.ru}

captcha:
  # На проде указывает на хостовый nginx-прокси (обход MTU black-hole для внешних HTTPS-вызовов,
  # см. deploy/web-server-deploy/deploy/80to8897 location /smartcaptcha/). Локально MTU-проблемы нет —
  # дефолт бьёт напрямую в Yandex.
  proxy-url: ${CAPTCHA_PROXY_URL:https://smartcaptcha.yandexcloud.net}

yookassa:
  # Тот же MTU-обход, см. 80to8897 location /yookassa/. shop-id/secret-key пустые по умолчанию —
  # PaymentService должен явно проверять их наличие и не пытаться создавать платежи без ключей
  # (самозанятость/магазин ЮKassa ещё не оформлены — см. план монетизации, Prerequisites).
  proxy-url: ${YOOKASSA_API_URL:https://api.yookassa.ru}
  shop-id: ${YOOKASSA_SHOP_ID:}
  secret-key: ${YOOKASSA_SECRET_KEY:}

stemjobs:
  # Премиум-фича «Создать минусовку из аудиофайла» — temp-директория загрузок, пока karaoke-app их
  # не заберёт (см. PublicStemJobController/InternalStemJobController). internal-secret — общий
  # секрет заголовка X-Internal-Secret с karaoke-app (Karaoke.stemJobsInternalSecret) — пусто по
  # умолчанию (эндпоинты internal/** по умолчанию закрыты, не открыты, см. authorized()).
  temp-dir: ${STEMJOBS_TEMP_DIR:/tmp/stemjobs}
  internal-secret: ${STEMJOBS_INTERNAL_SECRET:}

storage:
  key: ${STORAGE_KEY}
  secret: ${STORAGE_SECRET}
  folder: ${STORAGE_FOLDER}
  port-host: ${STORAGE_PORT_HOST}
  port-inside-container: ${STORAGE_PORT_INSIDE_CONTAINER}
  container-name: ${STORAGE_CONTAINER_NAME}
  console:
    port-host: ${STORAGE_CONSOLE_PORT_HOST}
    port-inside-container: ${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER}
  proxy-url: ${STORAGE_PROXY_URL:http://minio-proxy}
# specs/122-premium-auto-publish: VK OAuth (Authorization Code Flow) — endpoints
# /api/public/utils/vkOAuthCodeUrl и /api/public/utils/vkOAuthCallback.
# Используются для авторизации Standalone-приложения VK (видео.save, photos.* требуют
# user-token, см. archive/docs/features/vk-news-auto-publish.md, раздел "User-token через Implicit Flow").
#
# ВАЖНО:
# - vk.app-id, vk.redirect-uri, vk.client-secret задаются через ENV-переменные или прямо в
#   application.yml (как в Karaoke.properties). См. deploy/do.env на проде.
# - vk.redirect-uri ОБЯЗАН быть зарегистрирован в Standalone-приложении VK (oauth.vk.ru →
#   настройки приложения → "Доверенный Redirect URL").
# - vk.admin-api-url — куда callback попробует сохранить токен; если admin-машина недоступна,
#   callback вернёт HTML с curl-командой для ручного сохранения.
vk:
  app-id: ${VK_APP_ID:54704234}
  redirect-uri: ${VK_REDIRECT_URI:https://sm-karaoke.ru/api/public/utils/vkOAuthCallback}
  client-secret: ${VK_CLIENT_SECRET:}
  admin-api-url: ${VK_ADMIN_API_URL:http://nsa-i9:8898}
  # specs/151-vk-id-personal-token: VK ID (id.vk.ru) — новая система авторизации VK.
  # Заменил oauth.vk.ru (заблокирован Security Error 05.08.2026).
  # Настройки задаются при регистрации Web-приложения на https://id.vk.com/about/business/go/.
  # Redirect URI ОБЯЗАН быть зарегистрирован в кабинете VK ID.
  id:
    client-id: ${VK_ID_CLIENT_ID:0}
    client-secret: ${VK_ID_CLIENT_SECRET:}
    redirect-uri: ${VK_ID_REDIRECT_URI:https://sm-karaoke.ru/api/public/utils/vkIdOAuthCallback}
    admin-api-url: ${VK_ID_ADMIN_API_URL:http://nsa-i9:8898}
