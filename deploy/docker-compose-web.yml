version: "3.9"
services:

  karaoke-web:
    container_name: karaoke-web
    image: ${DOCKER_REGISTRY}/karaoke-web:${BUILD_VERSION}
    ports:
      - ${WEB_PORT_HOST}:${WEB_PORT_INSIDE_CONTAINER}
    environment:
      - WORK_ON_SERVER=0
      - WORK_IN_CONTAINER=1
      - STORAGE_FOLDER=${STORAGE_FOLDER}
      - STORAGE_PORT_HOST=${STORAGE_PORT_HOST}
      - STORAGE_PORT_INSIDE_CONTAINER=${STORAGE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONSOLE_PORT_HOST=${STORAGE_CONSOLE_PORT_HOST}
      - STORAGE_CONSOLE_PORT_INSIDE_CONTAINER=${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER}
      - STORAGE_CONTAINER_NAME=${STORAGE_CONTAINER_NAME}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_SECRET=${STORAGE_SECRET}
      - DB_LOCAL_POSTGRES_USER=${DB_LOCAL_POSTGRES_USER}
      # Спека 778 (KARAOKE-430): ограниченный пул соединений к БД.
      # Выключено по умолчанию → откат без пересборки (FR-011). Размеры — потолок
      # одновременно существующих handle'ов, посчитанный от конфигурации (см. plan.md).
      - KARAOKE_DB_POOL_ENABLED=${KARAOKE_DB_POOL_ENABLED:-0}
      - KARAOKE_DB_POOL_MAX_LOCAL=${KARAOKE_DB_POOL_MAX_LOCAL:-96}
      - KARAOKE_DB_POOL_MAX_SERVER=${KARAOKE_DB_POOL_MAX_SERVER:-10}
      - KARAOKE_DB_POOL_MIN_IDLE=${KARAOKE_DB_POOL_MIN_IDLE:-2}
      - KARAOKE_DB_POOL_ACQUIRE_TIMEOUT_MS=${KARAOKE_DB_POOL_ACQUIRE_TIMEOUT_MS:-5000}
      - KARAOKE_DB_POOL_MAX_LIFETIME_MS=${KARAOKE_DB_POOL_MAX_LIFETIME_MS:-1800000}
      - KARAOKE_DB_POOL_KEEPALIVE_MS=${KARAOKE_DB_POOL_KEEPALIVE_MS:-60000}
      - KARAOKE_DB_POOL_VALIDATION_TIMEOUT_MS=${KARAOKE_DB_POOL_VALIDATION_TIMEOUT_MS:-3000}
      # Порог удержания handle'а живым потоком, после которого оно считается
      # утечкой (DB-POOL-003). 6 часов — см. комментарий в application.yml.
      - KARAOKE_DB_POOL_LEAK_THRESHOLD_MS=${KARAOKE_DB_POOL_LEAK_THRESHOLD_MS:-21600000}
      # Ключ шифрования служебных полей между сервисами (sqlToInsert/sqlToDelete и кодовое
      # слово). Секрет живёт только в окружении (deploy/do.env, вне git) — в коде его нет.
      # Ключ и IV должны быть ОДИНАКОВЫМИ у karaoke-app (шифрует) и karaoke-web (расшифровывает).
      - CRYPTO_AES_KEY=${CRYPTO_AES_KEY}
      - CRYPTO_AES_IV=${CRYPTO_AES_IV}
      - DB_LOCAL_POSTGRES_PASSWORD=${DB_LOCAL_POSTGRES_PASSWORD}
      - DB_SERVER_POSTGRES_USER=${DB_SERVER_POSTGRES_USER}
      - DB_SERVER_POSTGRES_PASSWORD=${DB_SERVER_POSTGRES_PASSWORD}
      # На сервере "minio-proxy" — хостовый nginx (extra_hosts), проксирующий на удалённый MinIO
      # в обход MTU-проблемы. Локально MTU-проблемы нет — karaoke-minio-proxy ниже просто проксирует
      # на локальный MinIO-контейнер (karaoke-storage), сохраняя тот же путь "/minio/karaoke/...",
      # который код (fetchFromMinIO/existsInMinIO) строит одинаково в обоих окружениях.
      - STORAGE_PROXY_URL=http://karaoke-minio-proxy
      # Премиум-фича «Создать минусовку» (StemJob) — application.yml на проде ненадёжен (см. соседний
      # прод-compose), значение должно приходить отсюда напрямую (относится и к локальному запуску
      # через этот compose, для единообразия).
      - STEMJOBS_INTERNAL_SECRET=${STEMJOBS_INTERNAL_SECRET}
      # Секрет заголовка X-Internal-Secret для эндпоинта двуx-БД синхронизации
      # POST /changerecords (karaoke-web → sync.internal-secret). Пусто = доступ закрыт (fail-safe).
      - SYNC_INTERNAL_SECRET=${SYNC_INTERNAL_SECRET}
      # Серверный (секретный) ключ проверки капчи Yandex SmartCaptcha (спека 564, OpenProject #362).
      # Раньше лежал в публично изменяемой таблице tbl_public_settings — анонимный клиент мог его
      # обнулить, и проверка капчи становилась fail-open. Теперь ключ только здесь (env), а при
      # незаконной конфигурации регистрация отклоняется (fail-closed).
      - CAPTCHA_SERVER_KEY=${CAPTCHA_SERVER_KEY}
#    volumes:
#      - ${WEB_FOLDER_HOST}:${WEB_FOLDER_IN_CONTAINER}
    # Каталог настроек web-контейнера. KaraokeProperties пишет файл
    # /sm-karaoke/system/Karaoke.properties при первом обращении к настройкам;
    # без монтирования каталога нет — приложение падает с NoSuchFileException
    # при создании временного файла (ошибка в логе, работа продолжается на
    # значениях по умолчанию). Каталог ОТДЕЛЬНЫЙ от того, что у karaoke-app
    # (APP_FOLDER_SYSTEM), чтобы web не затирал настройки приложения.
    volumes:
      - ${WEB_SYSTEM_HOST:-/sm-karaoke/web-system}:/sm-karaoke/system
    networks:
      - karaokenet
    depends_on:
      - karaoke-minio-proxy
    entrypoint:
      - java
      - -Dfile.encoding=UTF-8
      - -Djava.security.egd=file:/dev/./urandom
      - -XX:+HeapDumpOnOutOfMemoryError
      - -XX:HeapDumpPath=/dumps
    command: ${APP_JAVA_OPTS} -jar /app.jar
    restart: always

  # Локальный аналог продакшн-хоста "minio-proxy" (см. deploy/karaoke-web/minio-proxy-local.conf) —
  # только для локальной разработки; на продакшн-сервере этот сервис не разворачивается, там
  # "minio-proxy" резолвится через extra_hosts в хостовый nginx (см. web-server-deploy/deploy).
  karaoke-minio-proxy:
    container_name: karaoke-minio-proxy
    image: nginx:stable
    volumes:
      - ./karaoke-web/minio-proxy-local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      karaokenet:
        aliases:
          - minio-proxy
    restart: always

networks:
  karaokenet:
    external: true # <-- Указываем, что сеть внешняя
