server:
  port: 8899
  tomcat:
    connection-timeout: 300000 # 300000 миллисекунд = 5 минут. Установите нужное значение.
    threads:
      # specs/087-fix-shared-db-connection: с переходом KaraokeConnection на ThreadLocal-кеш
      # соединений каждый поток Tomcat, обратившийся к WORKING_DATABASE, держит своё
      # физическое соединение с БД. Дефолт Spring Boot (200) даёт запас потоков больше,
      # чем max_connections у PostgreSQL (100, дефолт образа postgres:16) - консервативно
      # снижаем, чтобы держать заведомый запас под лимитом БД.
      max: 50

spring:
  thymeleaf:
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB
    cache: false
  main:
    allow-bean-definition-overriding: true

WORK_IN_CONTAINER: 0

work-in-container: ${WORK_IN_CONTAINER}
work-on-server: ${WORK_ON_SERVER:0}
db-local-postgres-user: ${DB_LOCAL_POSTGRES_USER}
db-local-postgres-password: ${DB_LOCAL_POSTGRES_PASSWORD}
db-remote-postgres-user: ${DB_SERVER_POSTGRES_USER}
db-remote-postgres-password: ${DB_SERVER_POSTGRES_PASSWORD}
db-remote-host: ${DB_REMOTE_HOST:188.119.64.111}
db-remote-port: ${DB_REMOTE_PORT:8832}

app:
  max-file-size: 100MB
  max-request-size: 100MB

storage:
  key: ${STORAGE_KEY}
  secret: ${STORAGE_SECRET}
  folder: ${STORAGE_FOLDER:karaoke}
  port-host: ${STORAGE_PORT_HOST:9000}
  port-inside-container: ${STORAGE_PORT_INSIDE_CONTAINER:9000}
  container-name: ${STORAGE_CONTAINER_NAME:karaoke-storage}
  # Удалённое (remote) хранилище — отдельный MinIO-сервер, куда karaoke-app заливает файлы для
  # публичного сайта. karaoke-app ходит туда напрямую через MinioClient (см. StorageApiClientImpl),
  # а не через прод-karaoke-web. Креды — те же storage.key/storage.secret.
  remote-endpoint: ${STORAGE_REMOTE_ENDPOINT:http://89.125.103.63:9000}
  console:
    port-host: ${STORAGE_CONSOLE_PORT_HOST:9001}
    port-inside-container: ${STORAGE_CONSOLE_PORT_INSIDE_CONTAINER:9001}

searxng:
  base-url: http://searxng:8080

# Поиск URL с текстами песен (specs/014-lyrics-search-replacement) — отдельный
# self-hosted бэкенд (fourget), НЕ searxng.base-url выше: тот остаётся только для
# поиска обложек альбомов (AlbumCoverService).
lyrics-search:
  base-url: http://fourget:80

