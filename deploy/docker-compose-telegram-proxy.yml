version: "3.9"
services:
  karaoke-telegram-proxy:
    image: sm-karaoke.ru:5443/mirror/xtls/xray-core:latest@sha256:4198aa816f04eeacde6470f4f07947eb4f701a1bba3657e366636681eaae5855
    container_name: karaoke-telegram-proxy
    command: ["run", "-c", "/usr/local/etc/xray/config.json"]
    volumes:
      # :rw — karaoke-app перегенерирует config.json из KaraokeProperties при старте
      # (TelegramProxyManager) и делает docker restart. Если telegramVlessEnabled=false —
      # файл не трогается, можно редактировать вручную как раньше.
      - /sm-karaoke/system/telegram-proxy/config.json:/usr/local/etc/xray/config.json:rw
    networks:
      - karaokenet
    restart: always

networks:
  karaokenet:
    external: true
