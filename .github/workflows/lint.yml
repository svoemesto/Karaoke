      - name: node --test
        # R-375: npm run только из каталога фронта (cd webvue3 && npm run ...).
        run: cd webvue3 && npm run test:unit

  # === Unit-тесты karaoke-public (встроенный раннер Node) ===
  # BR-523 / PKG-S3-02 (аудит #336, OpenProject #387): тесты публичного SPA
  # (node --test, 5+ файлов в src/**/__tests__/) не запускались НИ В ОДНОМ
  # джобе — регрессия (например, тихая поломка formatText) проходила молча.
  # Теперь у пакета есть скрипт `npm run test:unit` и джоб, который его зовёт.
  karaoke-public-unit-tests:
    name: unit tests (karaoke-public)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: karaoke-public/package-lock.json

      - name: npm ci (clean install)
        working-directory: karaoke-public
        run: npm ci --no-audit --no-fund

      - name: node --test
        # R-375: npm run только из каталога фронта (cd karaoke-public && npm run ...).
        run: cd karaoke-public && npm run test:unit

  # === Guard: тест экранирования метки комментария (BR-523) ===
  # Проверяет, что регрессионный тест «взведён» (падает на уязвимом снимке
  # кода и проходит на исправленном) и что его skip-состояние соответствует
  # состоянию production-кода. Фикстуры «до/после» — tools/fixtures/marker-escape/.
  marker-escape-guard:
    name: marker escape guard (BR-523)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check marker escaping test (до/после)
        run: bash tools/check-marker-escape-guard.sh

  # === E2E публичного сайта (BR-525) ===
  # Раньше e2e не выполнялись в CI вообще — расхождение «код в master» vs
  # «образ на сервере» обнаруживалось только вручную (прецедент #200–#203).
  # Джоб собирает образ karaoke-public из репозитория (R-04/R-05: nginx:stable
  # + node:22-alpine), поднимает его и прогоняет Playwright.
  karaoke-public-e2e:
    name: e2e (karaoke-public)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: karaoke-public/package-lock.json

      - name: Build karaoke-public image (R-04/R-05)
        # Базовые образы из приватного registry (sm-karaoke.ru) в CI недоступны,
        # поэтому собираем с публичных образов, разрешённых правилами:
        # R-04 — nginx:stable, R-05 — node:22-alpine.
        run: |
          docker build \
            -f deploy/karaoke-public/Dockerfile \
            --build-arg NODE_IMAGE=node:22-alpine \
            --build-arg NGINX_IMAGE=nginx:stable \
            -t karaoke-public:e2e .

      - name: Start karaoke-public container
        # Конфиг без проксирования /api на karaoke-web (его в CI нет) —
        # см. karaoke-public/e2e/nginx-e2e.conf.
        run: |
          docker run -d --name karaoke-public-e2e -p 7907:7907 \
            -v "$PWD/karaoke-public/e2e/nginx-e2e.conf:/etc/nginx/nginx.conf:ro" \
            karaoke-public:e2e

      - name: npm ci (clean install)
        working-directory: karaoke-public
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: karaoke-public
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (blocking)
        # Дымовая проверка «контракт развёртывания» (@smoke, BR-524) не
        # блокирует CI — она подтверждает, что редактор собрался и отдан.
        working-directory: karaoke-public
        env:
          E2E_BASE_URL: http://localhost:7907
        run: npx playwright test --grep-invert @smoke

      - name: Playwright e2e (smoke, BR-524 — не блокирует CI)
        working-directory: karaoke-public
        env:
          E2E_BASE_URL: http://localhost:7907
        continue-on-error: true
        run: npx playwright test --grep @smoke

      - name: Container logs (on failure)
        if: failure()
        run: docker logs karaoke-public-e2e
      - name: unit tests (webvue3)
        # Форма (cd webvue3 && npm run …) — как требует guard Pass 375
        # (tools/check-frontend-build.sh): в workflow `working-directory`
        # не распознаётся гвардом, а subshell работает и здесь.
        run: (cd webvue3 && npm run test:unit)