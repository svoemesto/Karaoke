server {
  listen 80;

  # Локальный (dev) аналог хостового nginx-хоста "minio-proxy" на проде
  # (см. deploy/prod-single-host/80to8897 — канон; старый
  # deploy/web-server-deploy/ — deprecated).
  # На проде с 2026-09-23 MinIO — ЛОКАЛЬНЫЙ контейнер на том же хосте
  # (127.0.0.1:8890); path-proxy сохранён ради нулевых изменений в Java-коде.
  # Локально на dev-машине karaoke-web и karaoke-storage — соседние контейнеры
  # в одной docker-сети, поэтому сайдкар проксирует на локальный MinIO по имени
  # контейнера — код в PublicApiController.kt/PublicPlayerController.kt не знает
  # разницы, т.к. всегда ходит на storage.proxy-url + "/minio/karaoke/...".
  location /minio/ {
    proxy_pass http://karaoke-storage:9000/;
    proxy_set_header Host karaoke-storage:9000;
    proxy_buffering off;
  }
}
